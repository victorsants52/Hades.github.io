<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Restricted Archive — Hades Corporation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="classified-page">
<main class="restricted-container">
    <section class="restricted-header">
        <p class="section-title">
            HADES CORPORATION
        </p>
        <h1>
            RESTRICTED ARCHIVE
        </h1>
        <p>
            EXECUTIVE AUTHENTICATION REQUIRED
        </p>
    </section>
    <section class="restricted-box">
        <div class="restricted-status">
            <span>
                SYSTEM STATUS
            </span>
            <strong id="systemStatus">
                AWAITING AUTHENTICATION
            </strong>
        </div>
        <label for="accessID">
            ACCESS ID
        </label>
        <input
            type="text"
            id="accessID"
            placeholder="Enter access ID"
            autocomplete="off">
        <label for="accessCode">
            ACCESS CODE
        </label>
        <input
            type="password"
            id="accessCode"
            placeholder="Enter access code"
            autocomplete="off">
        <button
            type="button"
            class="access-button"
            id="authenticateButton">
            AUTHENTICATE
        </button>
        <div
            id="authenticationResult"
            class="authentication-result">
        </div>
    </section>
    <footer class="classified-footer">
        <p>
            HADES CORPORATION
        </p>
        <p>
            INTERNAL SYSTEM // ACCESS LOGGED
        </p>
    </footer>
</main>
<script>
/* ==========================================
   EXECUTIVE CREDENTIALS
========================================== */
const EXECUTIVE_ID = "HDS-7149-AX";
const EXECUTIVE_CODE = "AETER-0917";
/* ==========================================
   ELEMENTS
========================================== */
const accessID =
    document.getElementById("accessID");
const accessCode =
    document.getElementById("accessCode");
const authenticateButton =
    document.getElementById(
        "authenticateButton"
    );
const result =
    document.getElementById(
        "authenticationResult"
    );
const systemStatus =
    document.getElementById(
        "systemStatus"
    );
/* ==========================================
   AUTHENTICATION
========================================== */
function authenticate() {
    const enteredID =
        accessID.value
        .trim()
        .toUpperCase();
    const enteredCode =
        accessCode.value
        .trim()
        .toUpperCase();
    /* ======================================
       WRONG CREDENTIALS
    ====================================== */
    if (
        enteredID !== EXECUTIVE_ID ||
        enteredCode !== EXECUTIVE_CODE
    ) {
        systemStatus.textContent =
            "AUTHENTICATION FAILED";
        result.innerHTML =
            "ACCESS DENIED<br><br>" +
            "INVALID CREDENTIALS.<br><br>" +
            "AUTHENTICATION ATTEMPT LOGGED.";
        return;
    }
    /* ======================================
       CORRECT CREDENTIALS
    ====================================== */
    systemStatus.textContent =
        "ACCESS GRANTED";
    result.innerHTML =
        "ACCESS GRANTED<br><br>" +
        "EXECUTIVE AUTHENTICATION SUCCESSFUL.<br><br>" +
        "LOADING EXECUTIVE ARCHIVE...";
    authenticateButton.disabled = true;
    accessID.disabled = true;
    accessCode.disabled = true;
    /* ======================================
       GO DIRECTLY TO EXECUTIVE.HTML
    ====================================== */
    setTimeout(function() {
        window.location.replace(
            "executive.html"
        );
    }, 1500);
}
/* ==========================================
   BUTTON
========================================== */
authenticateButton.addEventListener(
    "click",
    authenticate
);
/* ==========================================
   ENTER KEY
========================================== */
accessID.addEventListener(
    "keydown",
    function(event) {
        if (
            event.key === "Enter"
        ) {
            authenticate();
        }
    }
);
accessCode.addEventListener(
    "keydown",
    function(event) {
        if (
            event.key === "Enter"
        ) {
            authenticate();
        }
    }
);
</script>
</body>
</html>
